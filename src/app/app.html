@if (isCmsRoute()) {
  <router-outlet />
} @else {
  <div class="main-layout" [class.main-layout--player-closed]="this.player.getIsClose()">
    <app-header class="header-area"></app-header>

    <aside class="sidebar-area">
      <app-playlist-bar></app-playlist-bar>
    </aside>

    <main class="content-area">
      <router-outlet />
    </main>
    @if (!this.player.getIsClose()) {
      <app-player class="player-area"></app-player>
    }
  </div>
}
