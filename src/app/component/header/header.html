<header class="header">
  <div class="header__brand" routerLink="/" (click)="searchState.closeSearch()">
    <span class="header__logo">Meowic</span>
    <span class="header__patch">BETA</span>
  </div>

  <nav class="header__nav">
    <button class="header__nav__btn" routerLink="/songs" (click)="searchState.closeSearch()">所有歌曲</button>
    <button class="header__nav__btn" routerLink="/popular" (click)="searchState.closeSearch()">熱門歌曲</button>
    <button class="header__nav__btn" routerLink="/new-songs" (click)="searchState.closeSearch()">新增歌曲</button>
    <button class="header__nav__btn" type="button" (click)="openProDialog()">Meowic Pro</button>
    @if (auth.canAccessCms()) {
      <a
        class="header__nav__btn"
        routerLink="/cms"
        target="_blank"
        rel="noopener"
        (click)="searchState.closeSearch()"
      >
        CMS
      </a>
    }
  </nav>

  <div class="header__actions">
    <div class="header__search-shell" [class.header__search-shell--open]="searchState.isSearchOpen()">
      <button class="header__search-trigger" type="button" (click)="openSearch()" aria-label="搜尋">
        <mat-icon aria-hidden="true">search</mat-icon>
      </button>

      <label class="header__search" [attr.aria-hidden]="!searchState.isSearchOpen()">
        <mat-icon aria-hidden="true">search</mat-icon>
        <input
          #searchInput
          type="text"
          placeholder="搜尋"
          [ngModel]="searchState.query()"
          (ngModelChange)="updateSearch($event)"
          (blur)="collapseSearchIfEmpty()"
          [disabled]="!searchState.isSearchOpen()"
        />
      </label>
    </div>

    <div class="user">
      @if (!!auth.currentUserStatus()) {
        <div class="user__profile">
          <span class="user__name">{{ this.auth.user()?.name }}</span>
          @if (selectedProPlan()) {
            <span class="user__badge">{{ selectedProPlan() }}</span>
          }
        </div>
        <button class="user__login" type="button" (click)="logout()">登出</button>
      } @else {
        <button class="user__login" type="button" (click)="openLoginDialog()">登入</button>
      }
    </div>
  </div>
</header>

@if (this.isLoginDialogOpen()) {
  <app-login (close)="isLoginDialogOpen.set(false)"></app-login>
}

@if (this.isProDialogOpen()) {
  <app-pro-dialog
    (close)="isProDialogOpen.set(false)"
    (selected)="selectProPlan($event)"
  ></app-pro-dialog>
}
