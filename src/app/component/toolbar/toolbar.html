<main class="toolbar">
  <div class="toolbar__search-shell" [class.toolbar__search-shell--open]="searchState.isSearchOpen()">
    <button class="toolbar__btn" type="button" (click)="openSearch()">
      <mat-icon aria-hidden="true">search</mat-icon>
      搜尋
    </button>

    <label class="toolbar__search" [attr.aria-hidden]="!searchState.isSearchOpen()">
      <mat-icon aria-hidden="true">search</mat-icon>
      <input
        #searchInput
        type="text"
        placeholder="搜尋歌曲、專輯或藝人"
        [ngModel]="searchState.query()"
        (ngModelChange)="updateSearch($event)"
        (blur)="collapseSearchIfEmpty()"
        [disabled]="!searchState.isSearchOpen()"
      />
    </label>
  </div>
</main>
